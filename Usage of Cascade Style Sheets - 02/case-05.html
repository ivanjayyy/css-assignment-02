<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wallpaper Slideshow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .slideshow {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 100%;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            animation: slide 6s infinite;
        }

        .slide:nth-child(1) {
            background-image: url("../images/912059.jpg");
            animation-delay: 0s;
        }
        .slide:nth-child(2) {
            background-image: url("../images/digital-digital-art-artwork-fantasy-art-drawing-hd-wallpaper-thumb.jpg");
            animation-delay: 2s;
        }
        .slide:nth-child(3) {
            background-image: url("../images/painting-mountain-lake-with-mountain-background_188544-9126.jpg");
            animation-delay: 4s;
        }

        @keyframes slide {
            0%   { left: 100%; }
            5%   { left: 0; }
            30%  { left: 0; }
            35%  { left: -100%; }
            100% { left: -100%; }
        }
    </style>
</head>
<body>
<div class="slideshow">
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
</div>
</body>
</html>
