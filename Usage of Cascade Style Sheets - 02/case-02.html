<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>

        #parent{
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            margin: auto;

            width: 500px;
            height: 500px;
            border-radius: 50%;
            background-color: black;
            border-top: 30px solid red;
            border-bottom: 30px solid black;
            border-right: 30px solid black;
            border-left: 30px solid black;
            box-sizing: border-box;

            animation: loading 2s infinite;

        }

        @keyframes loading {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        #child  {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            margin: auto;

            width: 440px;
            height: 440px;
            border-radius: 50%;
            background-color: white;
            text-align: center;
        }

        h2{
            position: relative;
            top: 170px;
        }

    </style>
</head>
<body>

    <div id="parent">
    </div>

    <div id="child">
        <h2>
            Hello
        </h2>
    </div>

</body>
</html>
