<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="lib/normalize.css">
    <title>Title</title>

    <style>

        section {
            width: 800px;
            height: 500px;
            border: 4px solid black;

            overflow: hidden;
        }

        div {
            width: 200px;
            height: 100px;
            background: gold;
            border-radius: 20px;
            border: 1px solid black;

            animation-name: move;
            animation-duration: 3000ms;
            animation-iteration-count: infinite;
            animation-direction: alternate;

        }

        @keyframes move {
            0% {
                margin-left: 0;
                margin-top: 0;
                transform:rotateZ(0deg) ;
            }

            25% {
                background: yellow;
                margin-left: 600px;
                margin-top: 0;
                transform:rotateZ(180deg) ;
            }

            50% {
                background: green;
                margin-left: 600px;
                margin-top: 400px;
                transform:rotateZ(360deg) ;
            }

            75% {
                background: blue;
                margin-left: 0;
                margin-top: 400px;
                transform:rotateZ(540deg) ;
            }

            100% {
                background: red;
                margin-left: 0;
                margin-top: 0;
                transform:rotateZ(720deg) ;
            }
        }

    </style>
</head>
<body>

<section>
    <div></div>
</section>

</body>
</html>
